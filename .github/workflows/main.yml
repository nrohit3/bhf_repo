name: 'Prod Deployment'
concurrency: 1

on:
  push:
    branches:
      - main
    paths:
      - 'bhf_bundle2/**'

jobs:
  deploy:
    name: 'Deploy bhf bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy
        working-directory: bhf_bundle2
        env:
          DATABRICKS_TOKEN: ${{secrets.SP_TOKEN_1}}
          DATABRICKS_BUNDLE_ENV: prod
          

          
