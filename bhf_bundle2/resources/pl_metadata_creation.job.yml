# A sample job for bhf_bundle2.

resources:
  jobs:
    pl_metadata_creation:
      name: pl_metadata_creation

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../bhf2_project/1.metadata_creation.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
