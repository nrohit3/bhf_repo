# This is a Declarative Automation Bundle definition for bhf_bundle2.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bhf_bundle2
  uuid: fd06ecb9-75c6-421b-9a4d-eb9be6802d3f

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  env:
    description: The environment name

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: production
    #default: true
    workspace:
      host: https://dbc-c59b1472-afc6.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ts_bhf_dev
      schema: raw
      env: dev
    permissions:
      - user_name: nrohit3@gmail.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://dbc-408a3f5f-9a23.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/nrohit3@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ts_bhf_prod
      schema: raw
      env: prod
    permissions:
      - user_name: dbvrsn90@gmail.com
        level: CAN_MANAGE
